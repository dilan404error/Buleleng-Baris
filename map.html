<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Bus Map</title>


<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<link
rel="stylesheet"
href="style.css">

</head>


<body>


<div id="map"></div>


<div class="map-panel">


<h2>
🚌 Live Bus
</h2>


<div
id="connection"
class="gps-status">

Menghubungkan...

</div>


<div
id="busList">

Memuat bus...

</div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


const API_URL =
'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';


const map =
L.map(
'map'
).setView(
[-8.112,115.088],
13
);


L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{

maxZoom:
19,

attribution:
'© OpenStreetMap'

}
).addTo(
map
);


let buses = [];

let locations = [];

let drivers = [];

let markers = {};


function api(
action,
callback
) {

const name =
'map_' +
Date.now() +
Math.random();


window[name] =
callback;


const script =
document.createElement(
'script'
);


script.src =
API_URL +
'?action=' +
action +
'&callback=' +
name;


script.onerror =
function() {

document.getElementById(
'connection'
).innerText =
'🔴 Server gagal terhubung';

};


document.body.appendChild(
script
);

}


function loadData() {

api(
'getBuses',
function(busData) {

if (
!busData.success
) return;


buses =
busData.buses;


api(
'getLocations',
function(locationData) {

if (
!locationData.success
) return;


locations =
locationData.locations;


api(
'getDrivers',
function(driverData) {

if (
!driverData.success
) return;


drivers =
driverData.drivers;


render();

});

});

});

}


function findLocation(
busId
) {

return locations.find(
function(item) {

return String(
item.bus_id
).trim() ===
String(
busId
).trim();

}
);

}


function findDriver(
driverId
) {

return drivers.find(
function(item) {

return String(
item.driver_id
).trim() ===
String(
driverId
).trim();

}
);

}


function render() {

const list =
document.getElementById(
'busList'
);


list.innerHTML = '';


let online =
0;


buses.forEach(
function(bus) {

const location =
findLocation(
bus.bus_id
);


let driver =
null;


if (
location
) {

driver =
findDriver(
location.driver_id
);

}


const card =
document.createElement(
'div'
);


card.className =
'bus-card';


if (
location &&
!isNaN(
location.lat
) &&
!isNaN(
location.lng
)
) {

online++;


const lat =
Number(
location.lat
);


const lng =
Number(
location.lng
);


if (
!markers[bus.bus_id]
) {

markers[
bus.bus_id
] =
L.marker(
[
lat,
lng
],
{

icon:
L.divIcon({

className:
'bus-marker',

html:
'🚌',

iconSize:
[40,40]

})

}
).addTo(
map
);

} else {

markers[
bus.bus_id
].setLatLng(
[
lat,
lng
]
);

}


markers[
bus.bus_id
].bindPopup(`

<div class="popup">

<img
src="${
driver &&
driver.foto
?
driver.foto
:
'https://placehold.co/80x80'
}"
class="popup-photo"
>

<h3>
🚌 ${bus.no_bus}
</h3>

<p>
<b>
${bus.plat}
</b>
</p>

<p>
👨‍✈️
${
driver
?
driver.nama
:
'Driver'
}
</p>

<p>
🪪
${
location.driver_id
}
</p>

<p>
🟢
${location.status}
</p>

</div>

`);

}


card.innerHTML = `

<img
src="${
driver &&
driver.foto
?
driver.foto
:
'https://placehold.co/60x60'
}"
class="driver-photo"
>

<div>

<b>
🚌 ${bus.no_bus}
</b>

<br>

${bus.plat}

<br>

<span class="${
location
?
'online'
:
'offline'
}">

● ${
location
?
'BERJALAN'
:
'OFFLINE'
}

</span>

</div>

`;


if (
location
) {

card.onclick =
function() {

map.flyTo(
[
Number(
location.lat
),
Number(
location.lng
)
],
17
);


markers[
bus.bus_id
].openPopup();

};

}


list.appendChild(
card
);

});


document.getElementById(
'connection'
).innerText =

'🟢 Terhubung · ' +
online +
' bus aktif';

}


loadData();


setInterval(
loadData,
5000
);

</script>

</body>

</html>
