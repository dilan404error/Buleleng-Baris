<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Bus Realtime</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,
body {

    margin: 0;
    height: 100%;

}

#map {

    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<div id="map"></div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const API =
    'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';


const map =
    L.map('map')
     .setView(
         [-6.2, 106.816666],
         11
     );


L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


const markers =
    {};


const busIcon =
    L.divIcon({

        className: '',

        html: `
            <div style="
                background:white;
                width:44px;
                height:44px;
                border-radius:50%;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:27px;
                box-shadow:0 2px 10px rgba(0,0,0,.3);
                border:3px solid #222;
            ">
                🚌
            </div>
        `,

        iconSize: [
            44,
            44
        ],

        iconAnchor: [
            22,
            22
        ]

    });


async function loadLocations() {

    try {

        const response =
            await fetch(
                API +
                '?action=getLocations'
            );

        const data =
            await response.json();

        if (!data.ok) return;

        const activeIds =
            new Set();

        for (
            const bus
            of data.locations
        ) {

            activeIds.add(
                bus.bus_id
            );

            const position = [
                bus.lat,
                bus.lng
            ];


            if (
                markers[bus.bus_id]
            ) {

                markers[
                    bus.bus_id
                ].setLatLng(
                    position
                );

            } else {

                const marker =
                    L.marker(
                        position,
                        {
                            icon: busIcon
                        }
                    ).addTo(map);

                marker.bindPopup(`
                    <div style="
                        min-width:180px
                    ">

                        <h3>
                            🚌 ${bus.bus_id}
                        </h3>

                        <p>
                            Driver:
                            ${bus.driver_id}
                        </p>

                        <p>
                            Status:
                            🟢 Aktif
                        </p>

                    </div>
                `);

                markers[
                    bus.bus_id
                ] = marker;
            }
        }


        // Hapus marker yang sudah offline

        Object.keys(
            markers
        ).forEach(
            id => {

                if (
                    !activeIds.has(id)
                ) {

                    map.removeLayer(
                        markers[id]
                    );

                    delete markers[id];
                }
            }
        );

    } catch (error) {

        console.log(
            'Gagal mengambil lokasi',
            error
        );
    }
}


loadLocations();

setInterval(
    loadLocations,
    5000
);

</script>

</body>

</html>
