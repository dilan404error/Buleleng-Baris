<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BusTrack - Live Map</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: #f3f4f6;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.side-panel {
  position: fixed;
  left: 18px;
  top: 18px;
  bottom: 18px;
  width: 370px;
  background: rgba(255,255,255,.97);
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  padding: 20px;
  background: #111827;
  color: white;
}

.header-title {
  font-size: 23px;
  font-weight: 800;
}

.header-subtitle {
  margin-top: 5px;
  font-size: 13px;
  color: #cbd5e1;
}

.connection {
  display: flex;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 13px;
}

.connected {
  color: #16a34a;
  font-weight: bold;
}

.disconnected {
  color: #dc2626;
  font-weight: bold;
}

#busList {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.bus-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  margin-bottom: 10px;
  padding: 14px;
  cursor: pointer;
  transition: .15s;
}

.bus-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 20px rgba(0,0,0,.08);
}

.bus-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
}

.bus-name {
  font-size: 18px;
  font-weight: 800;
}

.live {
  background: #dcfce7;
  color: #15803d;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 10px;
  font-weight: 800;
}

.driver {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 13px;
}

.driver-photo,
.driver-placeholder {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  flex-shrink: 0;
}

.driver-photo {
  object-fit: cover;
  background: #e5e7eb;
}

.driver-placeholder {
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.driver-name {
  font-size: 15px;
  font-weight: 800;
}

.driver-id {
  color: #6b7280;
  font-size: 11px;
  margin-top: 3px;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.detail {
  background: #f9fafb;
  border-radius: 9px;
  padding: 8px;
}

.label {
  color: #6b7280;
  font-size: 10px;
}

.value {
  font-size: 12px;
  font-weight: 700;
  margin-top: 3px;
}

.empty {
  padding: 45px 20px;
  text-align: center;
  color: #6b7280;
  line-height: 1.6;
}

.bus-marker {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #2563eb;
  border: 4px solid white;
  box-shadow: 0 4px 15px rgba(0,0,0,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.popup {
  min-width: 250px;
}

.popup-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 12px;
}

.popup-driver {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.popup-photo,
.popup-placeholder {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}

.popup-photo {
  object-fit: cover;
}

.popup-placeholder {
  background: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 23px;
}

.popup-driver-name {
  font-weight: 800;
}

.popup-driver-id {
  font-size: 11px;
  color: #777;
}

.popup-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 6px 0;
  border-top: 1px solid #eee;
  font-size: 12px;
}

.popup-label {
  color: #777;
}

.popup-value {
  font-weight: bold;
  text-align: right;
}

.live-text {
  color: #16a34a;
}

@media (max-width: 700px) {

  .side-panel {
    left: 10px;
    right: 10px;
    top: 10px;
    bottom: auto;
    width: auto;
    max-height: 48vh;
  }

  #busList {
    max-height: 35vh;
  }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="side-panel">

  <div class="header">

    <div class="header-title">
      🚌 BusTrack
    </div>

    <div class="header-subtitle">
      Live Bus Tracking
    </div>

  </div>


  <div class="connection">

    <span id="connection">
      Menghubungkan...
    </span>

    <span id="count">
      0 bus
    </span>

  </div>


  <div id="busList">

    <div class="empty">
      Memuat bus...
    </div>

  </div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ==========================================================
// API
// ==========================================================

const API =
  "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


// ==========================================================
// MAP
// ==========================================================

const map =
  L.map("map");


map.setView(
  [-8.4095, 115.1889],
  10
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


// ==========================================================
// DATA
// ==========================================================

let buses = {};
let markers = {};


// ==========================================================
// ICON
// ==========================================================

const busIcon =
  L.divIcon({

    className: "",

    html: `
      <div class="bus-marker">
        🚌
      </div>
    `,

    iconSize: [
      50,
      50
    ],

    iconAnchor: [
      25,
      25
    ],

    popupAnchor: [
      0,
      -22
    ]

  });


// ==========================================================
// ESCAPE
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================================
// GET DATA
// ==========================================================

async function getLocations() {

  const response =
    await fetch(
      API +
      "?action=getLocations&t=" +
      Date.now(),
      {
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  console.log(
    "LIVE BUS:",
    data
  );


  if (!data.ok) {

    throw new Error(
      data.error ||
      "Gagal mendapatkan bus."
    );

  }


  return Array.isArray(
    data.locations
  )
    ? data.locations
    : [];

}


// ==========================================================
// POPUP
// ==========================================================

function createPopup(
  bus
) {

  let photoHtml;


  if (bus.foto_url) {

    photoHtml = `
      <img
        class="popup-photo"
        src="${escapeHtml(bus.foto_url)}"
        alt="Foto driver"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="popup-placeholder"
        style="display:none"
      >
        👤
      </div>
    `;

  } else {

    photoHtml = `
      <div class="popup-placeholder">
        👤
      </div>
    `;

  }


  return `

    <div class="popup">

      <div class="popup-title">

        🚌 Bus
        ${escapeHtml(
          bus.no_bus ||
          bus.bus_id
        )}

      </div>


      <div class="popup-driver">

        ${photoHtml}

        <div>

          <div class="popup-driver-name">

            ${escapeHtml(
              bus.driver_nama ||
              "Driver"
            )}

          </div>

          <div class="popup-driver-id">

            ID:
            ${escapeHtml(
              bus.driver_id ||
              "-"
            )}

          </div>

        </div>

      </div>


      <div class="popup-row">

        <span class="popup-label">
          Bus ID
        </span>

        <span class="popup-value">

          ${escapeHtml(
            bus.bus_id
          )}

        </span>

      </div>


      <div class="popup-row">

        <span class="popup-label">
          Plat
        </span>

        <span class="popup-value">

          ${escapeHtml(
            bus.plat ||
            "-"
          )}

        </span>

      </div>


      <div class="popup-row">

        <span class="popup-label">
          Kapasitas
        </span>

        <span class="popup-value">

          ${escapeHtml(
            bus.kapasitas ||
            "-"
          )}

        </span>

      </div>


      <div class="popup-row">

        <span class="popup-label">
          Status
        </span>

        <span class="popup-value live-text">

          ● LIVE

        </span>

      </div>


    </div>

  `;

}


// ==========================================================
// UPDATE MAP
// ==========================================================

function updateMap(
  locations
) {

  const active = {};


  locations.forEach(
    function(bus) {

      const busId =
        String(
          bus.bus_id ||
          ""
        ).trim();


      if (!busId) {
        return;
      }


      const lat =
        Number(bus.lat);


      const lng =
        Number(bus.lng);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;
      }


      active[busId] =
        true;


      buses[busId] =
        bus;


      const popup =
        createPopup(bus);


      // -----------------------------------------------
      // MARKER EXIST
      // -----------------------------------------------

      if (
        markers[busId]
      ) {

        markers[busId]
          .setLatLng([
            lat,
            lng
          ]);


        markers[busId]
          .setPopupContent(
            popup
          );


      }


      // -----------------------------------------------
      // MARKER BARU
      // -----------------------------------------------

      else {

        const marker =
          L.marker(
            [lat, lng],
            {
              icon:
                busIcon
            }
          );


        marker
          .addTo(map)
          .bindPopup(popup);


        markers[busId] =
          marker;

      }

    }
  );


  // -----------------------------------------------
  // HAPUS BUS OFF / TIMEOUT
  // -----------------------------------------------

  Object.keys(
    markers
  ).forEach(
    function(busId) {

      if (
        !active[busId]
      ) {

        map.removeLayer(
          markers[busId]
        );


        delete markers[
          busId
        ];


        delete buses[
          busId
        ];

      }

    }
  );

}


// ==========================================================
// BUS LIST
// ==========================================================

function updateList(
  locations
) {

  const container =
    document.getElementById(
      "busList"
    );


  container.innerHTML = "";


  document.getElementById(
    "count"
  ).textContent =
    locations.length +
    " bus live";


  if (
    locations.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        🚌

        <br><br>

        <b>
          Tidak ada bus yang sedang berjalan.
        </b>

        <br><br>

        Driver harus menekan
        <b> MULAI BEKERJA </b>
        dan GPS harus aktif.

      </div>

    `;

    return;
  }


  locations.forEach(
    function(bus) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "bus-card";


      let photoHtml;


      if (bus.foto_url) {

        photoHtml = `

          <img
            class="driver-photo"
            src="${escapeHtml(bus.foto_url)}"
            alt="Foto driver"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="driver-placeholder"
            style="display:none"
          >
            👤
          </div>

        `;

      } else {

        photoHtml = `

          <div class="driver-placeholder">
            👤
          </div>

        `;

      }


      card.innerHTML = `

        <div class="bus-top">

          <div class="bus-name">

            🚌
            ${escapeHtml(
              bus.no_bus ||
              bus.bus_id
            )}

          </div>

          <div class="live">

            ● LIVE

          </div>

        </div>


        <div class="driver">

          ${photoHtml}

          <div>

            <div class="driver-name">

              ${escapeHtml(
                bus.driver_nama ||
                "Driver"
              )}

            </div>

            <div class="driver-id">

              ID:
              ${escapeHtml(
                bus.driver_id ||
                "-"
              )}

            </div>

          </div>

        </div>


        <div class="details">


          <div class="detail">

            <div class="label">
              BUS ID
            </div>

            <div class="value">

              ${escapeHtml(
                bus.bus_id ||
                "-"
              )}

            </div>

          </div>


          <div class="detail">

            <div class="label">
              PLAT
            </div>

            <div class="value">

              ${escapeHtml(
                bus.plat ||
                "-"
              )}

            </div>

          </div>


          <div class="detail">

            <div class="label">
              KAPASITAS
            </div>

            <div class="value">

              ${escapeHtml(
                bus.kapasitas ||
                "-"
              )}

            </div>

          </div>


          <div class="detail">

            <div class="label">
              STATUS
            </div>

            <div
              class="value"
              style="color:#16a34a"
            >

              ● ONLINE

            </div>

          </div>


        </div>

      `;


      card.addEventListener(
        "click",
        function() {

          const marker =
            markers[
              bus.bus_id
            ];


          if (!marker) {
            return;
          }


          const position =
            marker.getLatLng();


          map.flyTo(
            position,
            16,
            {
              duration: .8
            }
          );


          setTimeout(
            function() {

              marker.openPopup();

            },
            500
          );

        }
      );


      container.appendChild(
        card
      );

    }
  );

}


// ==========================================================
// LOAD
// ==========================================================

async function refresh() {

  try {

    const locations =
      await getLocations();


    updateMap(
      locations
    );


    updateList(
      locations
    );


    document.getElementById(
      "connection"
    ).innerHTML = `

      <span class="connected">
        ● Terhubung
      </span>

    `;


  } catch (error) {

    console.error(
      "MAP ERROR:",
      error
    );


    document.getElementById(
      "connection"
    ).innerHTML = `

      <span class="disconnected">
        ● Terputus
      </span>

    `;

  }

}


// ==========================================================
// START
// ==========================================================

refresh();


setInterval(
  refresh,
  5000
);

</script>

</body>

</html>
