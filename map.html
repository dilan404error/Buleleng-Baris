<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Live Bus</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}

.panel {
  position: fixed;
  z-index: 1000;
  top: 20px;
  left: 20px;
  width: 300px;
  background: white;
  padding: 18px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.title {
  font-size: 20px;
  font-weight: bold;
}

.status {
  margin-top: 8px;
  color: #666;
}

.bus-card {
  margin-top: 12px;
  padding: 12px;
  background: #f4f6f8;
  border-radius: 10px;
}

.bus-name {
  font-size: 18px;
  font-weight: bold;
}

.online {
  color: #168a45;
  font-size: 13px;
  margin-top: 5px;
}

.bus-marker {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: white;
  border: 3px solid #1976d2;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
}

.driver-photo {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  object-fit: cover;
}

</style>

</head>

<body>

<div class="panel">

  <div class="title">
    🚌 Bus Sedang Berjalan
  </div>

  <div
    id="status"
    class="status"
  >
    Menghubungkan...
  </div>

  <div id="busList">
    Memuat...
  </div>

</div>


<div id="map"></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


const map =
  L.map(
    "map"
  )
  .setView(
    [-8.112, 115.088],
    12
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap"

  }
)
.addTo(map);


const markers = {};


const busIcon =
  L.divIcon({

    className: "",

    html:
      '<div class="bus-marker">🚌</div>',

    iconSize:
      [50, 50],

    iconAnchor:
      [25, 25]

  });


// =================================================
// JSONP
// =================================================

function api(
  action
) {

  return new Promise(
    function(resolve, reject) {

      const callback =
        "cb_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 10000
        );


      const script =
        document.createElement(
          "script"
        );


      let timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "Server timeout"
              )
            );

          },
          15000
        );


      window[callback] =
        function(data) {

          clearTimeout(
            timer
          );

          cleanup();

          resolve(data);

        };


      function cleanup() {

        delete window[
          callback
        ];

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.onerror =
        function() {

          clearTimeout(
            timer
          );

          cleanup();

          reject(
            new Error(
              "Gagal terhubung ke server"
            )
          );

        };


      script.src =
        API_URL +
        "?action=" +
        action +
        "&callback=" +
        callback;


      document.body.appendChild(
        script
      );

    }
  );

}


// =================================================
// LOAD ACTIVE BUS
// =================================================

async function loadActiveBuses() {

  const status =
    document.getElementById(
      "status"
    );


  const list =
    document.getElementById(
      "busList"
    );


  try {

    const result =
      await api(
        "getActiveLocations"
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message
      );

    }


    const locations =
      result.locations || [];


    status.innerText =
      locations.length +
      " bus sedang berjalan";


    /*
     * Hapus marker yang sudah tidak aktif.
     */

    const activeIds =
      {};


    locations.forEach(
      function(item) {

        activeIds[
          item.bus_id
        ] = true;

      }
    );


    Object.keys(
      markers
    )
    .forEach(
      function(busId) {

        if (
          !activeIds[busId]
        ) {

          map.removeLayer(
            markers[busId]
          );

          delete markers[
            busId
          ];

        }

      }
    );


    list.innerHTML = "";


    if (
      locations.length === 0
    ) {

      list.innerHTML =

        "<div style='margin-top:12px'>" +

        "Tidak ada bus yang sedang berjalan." +

        "</div>";

      return;

    }


    locations.forEach(
      function(bus) {

        updateMarker(
          bus
        );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "bus-card";


        card.innerHTML =

          "<div class='bus-name'>" +

          "🚌 " +

          escapeHTML(
            bus.no_bus
          ) +

          "</div>" +

          "<div>" +

          escapeHTML(
            bus.plat
          ) +

          "</div>" +

          "<div>" +

          "Driver: " +

          escapeHTML(
            bus.driver_name
          ) +

          "</div>" +

          "<div class='online'>" +

          "🟢 Sedang berjalan" +

          "</div>";


        card.onclick =
          function() {

            map.setView(
              [
                Number(bus.lat),
                Number(bus.lng)
              ],
              17
            );


            markers[
              bus.bus_id
            ].openPopup();

          };


        list.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    status.innerText =
      "❌ Gagal terhubung ke server";

  }

}


// =================================================
// MARKER
// =================================================

function updateMarker(
  bus
) {

  const lat =
    Number(
      bus.lat
    );


  const lng =
    Number(
      bus.lng
    );


  if (
    isNaN(lat) ||
    isNaN(lng)
  ) {

    return;

  }


  const popup =

    "<div>" +

    "<b>🚌 " +

    escapeHTML(
      bus.no_bus
    ) +

    "</b>" +

    "<br><br>" +

    "Plat: " +

    escapeHTML(
      bus.plat
    ) +

    "<br>" +

    "Driver: " +

    escapeHTML(
      bus.driver_name
    ) +

    "<br>" +

    "Status: 🟢 Sedang berjalan" +

    "<br>" +

    "Lokasi diperbarui: " +

    new Date(
      bus.timestamp
    ).toLocaleTimeString(
      "id-ID"
    ) +

    "</div>";


  if (
    !markers[
      bus.bus_id
    ]
  ) {

    markers[
      bus.bus_id
    ] =
      L.marker(
        [lat, lng],
        {
          icon:
            busIcon
        }
      )
      .addTo(map);

  } else {

    markers[
      bus.bus_id
    ]
    .setLatLng(
      [lat, lng]
    );

  }


  markers[
    bus.bus_id
  ]
  .bindPopup(
    popup
  );

}


// =================================================
// ESCAPE
// =================================================

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// =================================================
// START
// =================================================

loadActiveBuses();


/*
 * Update map setiap 5 detik.
 */

setInterval(
  loadActiveBuses,
  5000
);

</script>

</body>

</html>
