<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Login Driver</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
}

.container {
  max-width: 430px;
  margin: 80px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.1);
}

h1 {
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 55px;
}

.show {
  position: absolute;
  right: 10px;
  top: 23px;
  border: none;
  background: none;
  cursor: pointer;
  width: auto;
  padding: 5px;
}

button.login {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  background: #f1f3f5;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
🚌 Login Driver
</h1>

<input
  id="username"
  type="text"
  placeholder="Username"
>

<div class="password-box">

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button
  class="show"
  onclick="togglePassword()"
>
👁️
</button>

</div>

<button
  class="login"
  onclick="login()"
>
Masuk
</button>

<div id="status">
  Silakan login.
</div>

</div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


const SESSION_KEY =
  "bus_driver_session_v2";


function api(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callback =
        "cb_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      let timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "Server timeout."
              )
            );

          },
          15000
        );


      window[callback] =
        function(data) {

          clearTimeout(
            timer
          );

          cleanup();

          resolve(data);

        };


      function cleanup() {

        delete window[
          callback
        ];

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.onerror =
        function() {

          clearTimeout(
            timer
          );

          cleanup();

          reject(
            new Error(
              "Gagal terhubung ke server."
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        action;


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(
                key
              ) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&callback=" +
        callback;


      script.src = url;


      document.body.appendChild(
        script
      );

    }
  );

}


function togglePassword() {

  const input =
    document.getElementById(
      "password"
    );


  input.type =
    input.type === "password"
      ? "text"
      : "password";

}


async function login() {

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const status =
    document.getElementById(
      "status"
    );


  if (
    !username ||
    !password
  ) {

    status.innerText =
      "Username dan password wajib diisi.";

    return;

  }


  status.innerText =
    "Memeriksa akun...";


  try {

    const result =
      await api(
        "login",
        {
          username:
            username,

          password:
            password
        }
      );


    if (
      !result.success
    ) {

      status.innerText =
        "❌ " +
        result.message;

      return;

    }


    /*
     * SIMPAN TOKEN + DATA AKUN
     */

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify({

        token:
          result.token,

        driver:
          result.driver,

        bus:
          result.bus

      })
    );


    status.innerText =
      "✅ Login berhasil.";


    window.location.href =
      "driver.html";


  } catch (error) {

    status.innerText =
      "❌ " +
      error.message;

  }

}

</script>

</body>

</html>
