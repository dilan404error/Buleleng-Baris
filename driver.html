<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Driver - Live Bus</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="driver-page">


<div class="driver-container">


    <div class="driver-box">


        <div class="driver-header">

            <div class="driver-icon">
                🚌
            </div>

            <div>

                <div class="small-title">
                    DRIVER MODE
                </div>

                <h1>
                    Mulai Perjalanan
                </h1>

            </div>

        </div>


        <label>
            ID Driver
        </label>

        <input
            id="driverId"
            type="text"
            placeholder="Contoh: DR001"
        >


        <label>
            Pilih Bus
        </label>

        <select
            id="busSelect">

            <option value="">
                Memuat bus...
            </option>

        </select>


        <div
            id="driverInfo"
            class="selected-bus">

            Pilih bus terlebih dahulu.

        </div>


        <button
            id="startButton"
            class="btn-primary full"
            onclick="startTracking()">

            📍 Mulai Tracking

        </button>


        <button
            id="stopButton"
            class="btn-danger full hidden"
            onclick="stopTracking()">

            ⛔ Hentikan Tracking

        </button>


        <div
            id="gpsStatus"
            class="gps-status">

            🔴 GPS belum aktif

        </div>


        <div
            id="coordinates"
            class="coordinates-box">

            Latitude:
            -

            <br>

            Longitude:
            -

        </div>


    </div>

</div>


<script>


const API_URL =
    "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


let watchId =
    null;


let isTracking =
    false;


let buses =
    [];


/* =========================================
   JSONP
========================================= */

function requestJSONP(
    action,
    callbackFunction,
    params = ''
) {

    const callbackName =
        'driver_' +
        Date.now();


    window[callbackName] =
        function(data) {

            callbackFunction(data);

            delete window[
                callbackName
            ];

            const old =
                document.getElementById(
                    callbackName
                );

            if (old) {
                old.remove();
            }

        };


    const script =
        document.createElement(
            'script'
        );


    script.id =
        callbackName;


    script.src =
        API_URL +
        '?action=' +
        action +
        params +
        '&callback=' +
        callbackName;


    script.onerror =
        function() {

            document.getElementById(
                'gpsStatus'
            ).innerHTML =
                '🔴 Server tidak terhubung';

            script.remove();

        };


    document.body.appendChild(
        script
    );

}


/* =========================================
   LOAD BUS
========================================= */

function loadBuses() {

    requestJSONP(
        'bus',
        function(data) {

            if (
                data.status ===
                'error'
            ) {

                alert(
                    data.message
                );

                return;

            }


            buses =
                data || [];


            const select =
                document.getElementById(
                    'busSelect'
                );


            select.innerHTML =
                '<option value="">Pilih bus</option>';


            buses.forEach(
                function(bus) {

                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        bus.bus_id;


                    option.textContent =
                        bus.no_bus +
                        ' - ' +
                        bus.plat;


                    select.appendChild(
                        option
                    );

                }
            );

        }
    );

}


/* =========================================
   PILIH BUS
========================================= */

document.getElementById(
    'busSelect'
).addEventListener(
    'change',
    function() {

        const busId =
            this.value;


        const bus =
            buses.find(
                function(item) {

                    return item.bus_id ===
                        busId;

                }
            );


        const info =
            document.getElementById(
                'driverInfo'
            );


        if (!bus) {

            info.innerHTML =
                'Pilih bus terlebih dahulu.';

            return;

        }


        info.innerHTML = `

            <b>
                🚌 ${bus.no_bus}
            </b>

            <br>

            Plat:
            ${bus.plat}

            <br>

            Kapasitas:
            ${bus.kapasitas}

        `;

    }
);


/* =========================================
   START TRACKING
========================================= */

function startTracking() {

    const driverId =
        document.getElementById(
            'driverId'
        ).value.trim();


    const busId =
        document.getElementById(
            'busSelect'
        ).value;


    if (!driverId) {

        alert(
            'Masukkan ID Driver!'
        );

        return;

    }


    if (!busId) {

        alert(
            'Pilih bus!'
        );

        return;

    }


    if (
        !navigator.geolocation
    ) {

        alert(
            'Browser tidak mendukung GPS.'
        );

        return;

    }


    isTracking =
        true;


    document.getElementById(
        'startButton'
    ).classList.add(
        'hidden'
    );


    document.getElementById(
        'stopButton'
    ).classList.remove(
        'hidden'
    );


    document.getElementById(
        'gpsStatus'
    ).innerHTML =
        '🟡 Meminta akses GPS...';


    watchId =
        navigator.geolocation.watchPosition(

            function(position) {

                sendLocation(
                    driverId,
                    busId,
                    position
                );

            },

            function(error) {

                console.error(
                    error
                );


                document.getElementById(
                    'gpsStatus'
                ).innerHTML =
                    '🔴 GPS Error: ' +
                    error.message;

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    2000,

                timeout:
                    10000

            }

        );

}


/* =========================================
   SEND LOCATION
========================================= */

function sendLocation(
    driverId,
    busId,
    position
) {

    if (!isTracking)
        return;


    const lat =
        position.coords.latitude;


    const lng =
        position.coords.longitude;


    document.getElementById(
        'coordinates'
    ).innerHTML = `

        Latitude:
        ${lat.toFixed(6)}

        <br>

        Longitude:
        ${lng.toFixed(6)}

    `;


    document.getElementById(
        'gpsStatus'
    ).innerHTML =
        '🟢 GPS aktif · Mengirim lokasi...';


    const params =

        '&bus_id=' +
        encodeURIComponent(
            busId
        ) +

        '&driver_id=' +
        encodeURIComponent(
            driverId
        ) +

        '&lat=' +
        encodeURIComponent(
            lat
        ) +

        '&lng=' +
        encodeURIComponent(
            lng
        ) +

        '&status=BERJALAN';


    requestJSONP(
        'update',
        function(data) {

            console.log(
                'GPS:',
                data
            );


            if (
                data.status ===
                'ok'
            ) {

                document.getElementById(
                    'gpsStatus'
                ).innerHTML =
                    '🟢 GPS aktif · Lokasi terkirim';

            }

        },
        params
    );

}


/* =========================================
   STOP TRACKING
========================================= */

function stopTracking() {

    isTracking =
        false;


    if (
        watchId !== null
    ) {

        navigator.geolocation
            .clearWatch(
                watchId
            );

        watchId =
            null;

    }


    document.getElementById(
        'startButton'
    ).classList.remove(
        'hidden'
    );


    document.getElementById(
        'stopButton'
    ).classList.add(
        'hidden'
    );


    document.getElementById(
        'gpsStatus'
    ).innerHTML =
        '⚫ Tracking dihentikan';

}


/* =========================================
   START
========================================= */

loadBuses();

</script>

</body>

</html>
