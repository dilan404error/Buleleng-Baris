<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Driver</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="driver-page">

    <div class="topbar">

        <strong>🚌 BusTrack</strong>

        <button
            class="logout"
            onclick="logout()">
            Keluar
        </button>

    </div>


    <div class="profile-card">

        <div class="avatar">
            👤
        </div>

        <h2 id="nama">
            Driver
        </h2>

        <p id="username"></p>

        <div class="bus-info">

            <strong id="bus">
                BUS
            </strong>

            <span id="status">
                OFFLINE
            </span>

        </div>

    </div>


    <div class="work-card">

        <p>Status kerja</p>

        <div id="workStatus">
            OFFLINE
        </div>

        <button
            id="workButton"
            onclick="toggleWork()">

            🟢 MULAI BEKERJA

        </button>

    </div>


    <div class="location-card">

        <h3>Lokasi GPS</h3>

        <p id="gps">
            GPS belum aktif
        </p>

    </div>


    <a
        class="map-button"
        href="map.html">

        🗺️ LIHAT PETA BUS

    </a>

</div>


<script>

const API =
    'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';

const token =
    localStorage.getItem(
        'bus_token'
    );

if (!token) {

    location.href =
        'index.html';
}


let working = false;

let watchId = null;


// ==========================
// PROFILE
// ==========================

async function loadProfile() {

    const response =
        await fetch(
            API +
            '?action=profile' +
            '&token=' +
            encodeURIComponent(token)
        );

    const data =
        await response.json();

    if (!data.ok) {

        localStorage.clear();

        location.href =
            'index.html';

        return;
    }

    const driver =
        data.driver;

    document.getElementById(
        'nama'
    ).textContent =
        driver.nama;

    document.getElementById(
        'username'
    ).textContent =
        '@' + driver.username;

    document.getElementById(
        'bus'
    ).textContent =
        driver.bus_id;

    setUI(
        driver.status_kerja === 'ON'
    );
}


// ==========================
// UI
// ==========================

function setUI(isWorking) {

    working =
        isWorking;

    const status =
        document.getElementById(
            'workStatus'
        );

    const button =
        document.getElementById(
            'workButton'
        );

    if (working) {

        status.textContent =
            '🟢 SEDANG BEKERJA';

        button.textContent =
            '🔴 SELESAI BEKERJA';

        startGPS();

    } else {

        status.textContent =
            '⚪ OFFLINE';

        button.textContent =
            '🟢 MULAI BEKERJA';

        stopGPS();
    }
}


// ==========================
// TOGGLE
// ==========================

async function toggleWork() {

    const newStatus =
        working
            ? 'OFF'
            : 'ON';

    const url =
        API +
        '?action=changeWorkStatus' +
        '&token=' +
        encodeURIComponent(token) +
        '&status=' +
        newStatus;

    const response =
        await fetch(url);

    const data =
        await response.json();

    if (data.ok) {

        setUI(
            newStatus === 'ON'
        );
    }
}


// ==========================
// GPS
// ==========================

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById(
            'gps'
        ).textContent =
            'Browser tidak mendukung GPS.';

        return;
    }

    navigator.geolocation.watchPosition(
  function(position) {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    fetch(API_URL + '?action=updateLocation'
      + '&token=' + encodeURIComponent(token)
      + '&lat=' + lat
      + '&lng=' + lng
    )
    .then(res => res.json())
    .then(data => {
      console.log('Lokasi bus:', data);
    })
    .catch(err => {
      console.error('Gagal update lokasi:', err);
    });

  },
  function(error) {
    console.error('GPS error:', error);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 10000,
    timeout: 15000
  }
);


function stopGPS() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }

    document.getElementById(
        'gps'
    ).textContent =
        'GPS tidak aktif';
}


async function sendLocation(position) {

    if (!working) return;

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;

    document.getElementById(
        'gps'
    ).textContent =
        `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

    const form =
        new URLSearchParams();

    form.append(
        'action',
        'updateLocation'
    );

    form.append(
        'token',
        token
    );

    form.append(
        'lat',
        lat
    );

    form.append(
        'lng',
        lng
    );

    try {

        await fetch(
            API,
            {
                method: 'POST',
                body: form
            }
        );

    } catch (error) {

        console.log(
            'GPS gagal dikirim',
            error
        );
    }
}


function gpsError(error) {

    document.getElementById(
        'gps'
    ).textContent =
        'GPS belum tersedia.';
}


// ==========================
// LOGOUT
// ==========================

async function logout() {

    try {

        await fetch(
            API +
            '?action=logout' +
            '&token=' +
            encodeURIComponent(token)
        );

    } catch (error) {}

    localStorage.clear();

    location.href =
        'index.html';
}


loadProfile();

</script>

</body>
</html>
