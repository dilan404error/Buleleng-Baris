<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Driver Bus</title>

<style>

body {

    margin: 0;

    font-family: Arial;

    background: #f3f5f8;

}


.container {

    max-width: 450px;

    margin: auto;

    padding: 25px;

}


.card {

    background: white;

    padding: 25px;

    border-radius: 20px;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.1);

}


input {

    width: 100%;

    padding: 13px;

    margin:
    8px 0 15px;

    border:
    1px solid #ddd;

    border-radius: 10px;

}


button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #1976d2;

    color: white;

    font-size: 16px;

    font-weight: bold;

}


.stop {

    background: #d32f2f;

}


#status {

    margin-top: 20px;

    padding: 15px;

    background: #f5f5f5;

    border-radius: 10px;

}

</style>

</head>


<body>


<div class="container">

<div class="card">

<h2>
🚌 Driver Bus
</h2>


<label>
Nomor Bus
</label>

<input
id="busId"
placeholder="Contoh: BUS01"
>


<label>
Nama Driver
</label>

<input
id="driverName"
placeholder="Nama driver"
>


<label>
Nomor Driver
</label>

<input
id="driverNo"
placeholder="Contoh: 01"
>


<label>
Foto Driver
</label>

<input
id="driverPhoto"
placeholder="URL foto driver"
>


<button
id="startButton"
onclick="startTracking()">

▶ Mulai Perjalanan

</button>


<div id="status">

Status:
🔴 Offline

</div>

</div>

</div>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


let watchId = null;


/* ============================
   START GPS
============================ */

function startTracking() {


    const busId =
    document.getElementById(
        'busId'
    ).value;


    const driverName =
    document.getElementById(
        'driverName'
    ).value;


    const driverNo =
    document.getElementById(
        'driverNo'
    ).value;


    const driverPhoto =
    document.getElementById(
        'driverPhoto'
    ).value;


    if (!busId ||
        !driverName) {

        alert(
            'Isi nomor bus dan nama driver!'
        );

        return;

    }


    if (!navigator.geolocation) {

        alert(
            'Browser tidak mendukung GPS'
        );

        return;

    }


    document.getElementById(
        'startButton'
    ).innerText =
    '🟢 GPS Aktif';


    document.getElementById(
        'startButton'
    ).className =
    'stop';


    document.getElementById(
        'status'
    ).innerText =
    '🟢 Mengambil lokasi GPS...';


    watchId =
    navigator.geolocation.watchPosition(

        function(position) {

            sendLocation(
                busId,
                driverName,
                driverNo,
                driverPhoto,
                position
            );

        },

        function(error) {

            console.error(error);

            document.getElementById(
                'status'
            ).innerText =
            '❌ GPS gagal: ' +
            error.message;

        },

        {

            enableHighAccuracy:
            true,

            maximumAge:
            2000,

            timeout:
            10000

        }

    );

}


/* ============================
   SEND LOCATION
============================ */

function sendLocation(
    busId,
    driverName,
    driverNo,
    driverPhoto,
    position
) {


    const lat =
    position.coords.latitude;


    const lng =
    position.coords.longitude;


    const speed =
    position.coords.speed
    ?
    position.coords.speed * 3.6
    :
    0;


    const heading =
    position.coords.heading || 0;


    document.getElementById(
        'status'
    ).innerHTML = `

        🟢 GPS Aktif

        <br>

        Latitude:
        ${lat.toFixed(6)}

        <br>

        Longitude:
        ${lng.toFixed(6)}

        <br>

        Kecepatan:
        ${speed.toFixed(1)}
        km/jam

    `;


    const callback =
    'update_' +
    Date.now();


    window[callback] =
    function(data) {

        console.log(
            'Server:',
            data
        );

        delete window[callback];

    };


    const url =
    API_URL +

    '?action=update' +

    '&callback=' +
    callback +

    '&bus_id=' +
    encodeURIComponent(
        busId
    ) +

    '&driver_name=' +
    encodeURIComponent(
        driverName
    ) +

    '&driver_no=' +
    encodeURIComponent(
        driverNo
    ) +

    '&driver_photo=' +
    encodeURIComponent(
        driverPhoto
    ) +

    '&lat=' +
    lat +

    '&lng=' +
    lng +

    '&speed=' +
    speed +

    '&heading=' +
    heading +

    '&status=Berjalan';


    const script =
    document.createElement(
        'script'
    );


    script.src = url;


    document.body.appendChild(
        script
    );

}


</script>

</body>

</html>
