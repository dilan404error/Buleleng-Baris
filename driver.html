<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>BusTrack - Driver</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.driver-page {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5px;
}

.topbar strong {
  font-size: 22px;
}

.logout {
  border: none;
  background: #fee2e2;
  color: #b91c1c;
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #e5e7eb;
  margin: auto;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile {
  text-align: center;
}

.profile h2 {
  margin: 12px 0 5px;
}

.username {
  color: #6b7280;
}

.bus-box {
  margin-top: 18px;
  padding: 15px;
  background: #f9fafb;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status-online {
  color: #16a34a;
  font-weight: bold;
}

.status-offline {
  color: #6b7280;
  font-weight: bold;
}

.work-card {
  text-align: center;
}

.work-status {
  font-size: 22px;
  font-weight: bold;
  margin: 15px 0;
}

.work-button {
  width: 100%;
  border: none;
  padding: 16px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #16a34a;
  color: white;
}

.stop {
  background: #dc2626;
  color: white;
}

.work-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.gps-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.gps {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
  word-break: break-word;
}

.map-button {
  display: block;
  text-align: center;
  background: #111827;
  color: white;
  text-decoration: none;
  padding: 16px;
  border-radius: 14px;
  font-weight: bold;
}

.error {
  color: #dc2626;
}

</style>

</head>

<body>

<div class="driver-page">

  <div class="topbar">

    <strong>
      🚌 BusTrack
    </strong>

    <button
      class="logout"
      onclick="logout()">

      Keluar

    </button>

  </div>


  <!-- PROFILE -->

  <div class="card profile">

    <div
      class="avatar"
      id="avatar">

      👤

    </div>

    <h2 id="nama">
      Driver
    </h2>

    <div
      class="username"
      id="username">

      Memuat...

    </div>


    <div class="bus-box">

      <strong id="bus">
        BUS
      </strong>

      <span
        id="status"
        class="status-offline">

        ⚪ OFFLINE

      </span>

    </div>

  </div>


  <!-- WORK -->

  <div class="card work-card">

    <div>
      Status kerja
    </div>

    <div
      class="work-status"
      id="workStatus">

      ⚪ OFFLINE

    </div>

    <button
      id="workButton"
      class="work-button start"
      onclick="toggleWork()">

      🟢 MULAI BEKERJA

    </button>

  </div>


  <!-- GPS -->

  <div class="card">

    <div class="gps-title">
      📍 Lokasi GPS
    </div>

    <div
      class="gps"
      id="gps">

      GPS belum aktif.

    </div>

  </div>


  <a
    href="map.html"
    class="map-button">

    🗺️ LIHAT PETA BUS

  </a>

</div>


<script>


// ==========================================================
// API
// ==========================================================

const API =
  "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


// ==========================================================
// TOKEN
// ==========================================================

const token =
  localStorage.getItem(
    "bus_token"
  );


if (!token) {

  window.location.href =
    "index.html";

}


// ==========================================================
// STATE
// ==========================================================

let working = false;
let watchId = null;


// ==========================================================
// API GET
// ==========================================================

async function api(
  action,
  params = {}
) {

  const query =
    new URLSearchParams();

  query.append(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(key) {

      query.append(
        key,
        params[key]
      );

    });


  const response =
    await fetch(
      API +
      "?" +
      query.toString() +
      "&t=" +
      Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );
  }


  return await response.json();
}


// ==========================================================
// PROFILE
// ==========================================================

async function loadProfile() {

  try {

    const data =
      await api(
        "profile",
        {
          token: token
        }
      );


    if (!data.ok) {

      localStorage.removeItem(
        "bus_token"
      );

      window.location.href =
        "index.html";

      return;
    }


    const driver =
      data.driver;


    document.getElementById(
      "nama"
    ).textContent =
      driver.nama ||
      "Driver";


    document.getElementById(
      "username"
    ).textContent =
      "@" +
      (
        driver.username ||
        "-"
      );


    document.getElementById(
      "bus"
    ).textContent =
      driver.bus_id ||
      "Belum ada bus";


    if (driver.foto_url) {

      document.getElementById(
        "avatar"
      ).innerHTML =
        `
          <img
            src="${escapeHtml(driver.foto_url)}"
            alt="Foto driver"
          >
        `;
    }


    const isWorking =
      String(
        driver.status_kerja ||
        "OFF"
      ).toUpperCase() === "ON";


    setUI(
      isWorking
    );


  } catch (error) {

    console.error(
      "PROFILE ERROR:",
      error
    );


    document.getElementById(
      "username"
    ).textContent =
      "Gagal memuat profil.";
  }

}


// ==========================================================
// UI
// ==========================================================

function setUI(
  isWorking
) {

  working =
    isWorking;


  const workStatus =
    document.getElementById(
      "workStatus"
    );


  const button =
    document.getElementById(
      "workButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  if (working) {

    workStatus.textContent =
      "🟢 SEDANG BEKERJA";


    button.textContent =
      "🔴 SELESAI BEKERJA";


    button.className =
      "work-button stop";


    status.textContent =
      "🟢 ONLINE";


    status.className =
      "status-online";


    startGPS();

  } else {

    workStatus.textContent =
      "⚪ OFFLINE";


    button.textContent =
      "🟢 MULAI BEKERJA";


    button.className =
      "work-button start";


    status.textContent =
      "⚪ OFFLINE";


    status.className =
      "status-offline";


    stopGPS();

  }

}


// ==========================================================
// TOGGLE WORK
// ==========================================================

async function toggleWork() {

  const button =
    document.getElementById(
      "workButton"
    );


  const newStatus =
    working
      ? "OFF"
      : "ON";


  button.disabled =
    true;


  try {

    const data =
      await api(
        "changeWorkStatus",
        {
          token: token,
          status: newStatus
        }
      );


    if (!data.ok) {

      alert(
        data.error ||
        "Gagal mengubah status."
      );

      return;
    }


    setUI(
      newStatus === "ON"
    );


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Gagal terhubung ke server."
    );

  } finally {

    button.disabled =
      false;

  }

}


// ==========================================================
// START GPS
// ==========================================================

function startGPS() {

  if (watchId !== null) {
    return;
  }


  if (
    !navigator.geolocation
  ) {

    document.getElementById(
      "gps"
    ).innerHTML =
      '<span class="error">Browser tidak mendukung GPS.</span>';

    return;
  }


  document.getElementById(
    "gps"
  ).textContent =
    "📡 Mencari lokasi...";


  watchId =
    navigator.geolocation.watchPosition(

      function(position) {

        sendLocation(
          position
        );

      },

      function(error) {

        console.error(
          "GPS ERROR:",
          error
        );


        let message =
          "GPS belum tersedia.";


        if (
          error.code === 1
        ) {

          message =
            "Izin lokasi ditolak. Aktifkan lokasi untuk browser ini.";

        } else if (
          error.code === 2
        ) {

          message =
            "Lokasi tidak tersedia.";

        } else if (
          error.code === 3
        ) {

          message =
            "GPS timeout. Mencoba lagi...";

        }


        document.getElementById(
          "gps"
        ).textContent =
          message;

      },

      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      }

    );

}


// ==========================================================
// STOP GPS
// ==========================================================

function stopGPS() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;
  }


  document.getElementById(
    "gps"
  ).textContent =
    "GPS tidak aktif.";
}


// ==========================================================
// SEND LOCATION
// ==========================================================

async function sendLocation(
  position
) {

  if (!working) {
    return;
  }


  const lat =
    position.coords.latitude;


  const lng =
    position.coords.longitude;


  const accuracy =
    position.coords.accuracy;


  document.getElementById(
    "gps"
  ).textContent =

    "📍 " +
    lat.toFixed(6) +
    ", " +
    lng.toFixed(6) +
    " • ±" +
    Math.round(
      accuracy
    ) +
    " m";


  try {

    const data =
      await api(
        "updateLocation",
        {
          token: token,
          lat: lat,
          lng: lng
        }
      );


    console.log(
      "LOCATION:",
      data
    );


    if (!data.ok) {

      console.error(
        "UPDATE LOCATION:",
        data.error
      );
    }


  } catch (error) {

    console.error(
      "SEND LOCATION ERROR:",
      error
    );

  }

}


// ==========================================================
// LOGOUT
// ==========================================================

async function logout() {

  stopGPS();


  try {

    await api(
      "logout",
      {
        token: token
      }
    );

  } catch (error) {

    console.error(
      error
    );

  }


  localStorage.removeItem(
    "bus_token"
  );


  window.location.href =
    "index.html";

}


// ==========================================================
// ESCAPE HTML
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


// ==========================================================
// START
// ==========================================================

loadProfile();

</script>

</body>
</html>
