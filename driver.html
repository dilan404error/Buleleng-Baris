<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard Driver</title>

<link
rel="stylesheet"
href="style.css">

</head>


<body class="driver-page">


<div class="driver-dashboard">


<div class="driver-top">

<div>

<span class="badge">
DRIVER MODE
</span>

<h1>
Dashboard Driver
</h1>

</div>


<button
class="logout"
onclick="logout()">

Keluar

</button>

</div>


<div
id="profile"
class="profile-card">
</div>


<div class="bus-dashboard">


<h2>
🚌 Bus Anda
</h2>


<div
id="busInfo">
</div>


<button
id="start"
class="btn full"
onclick="startTracking()">

📍 Mulai Perjalanan

</button>


<button
id="stop"
class="stop full"
onclick="stopTracking()"
style="display:none">

⛔ Hentikan Perjalanan

</button>


<div
id="status"
class="gps-status">

⚫ GPS belum aktif

</div>


<div
id="coordinates"
class="coordinates-box">

Latitude: -

<br>

Longitude: -

</div>


</div>


</div>


<script>


const API_URL =
'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';


let session =
localStorage.getItem(
'driverSession'
);


if (!session) {

window.location =
'login.html';

}


session =
JSON.parse(
session
);


const driver =
session.driver;


const bus =
session.bus;


document.getElementById(
'profile'
).innerHTML = `

<img
src="${
driver.foto ||
'https://placehold.co/100x100'
}"
class="driver-photo-large"
>

<div>

<h2>
${driver.nama}
</h2>

<p>
ID:
${driver.driver_id}
</p>

<p>
Username:
${driver.username}
</p>

</div>

`;


document.getElementById(
'busInfo'
).innerHTML = `

<div class="assigned-bus">

<div class="bus-big">
🚌
</div>

<div>

<h2>
${bus.no_bus}
</h2>

<p>
Bus ID:
${bus.bus_id}
</p>

<p>
Plat:
${bus.plat}
</p>

<p>
Kapasitas:
${bus.kapasitas}
</p>

</div>

</div>

`;


let watchId =
null;


let tracking =
false;


function api(
action,
params,
callback
) {

const name =
'driver_' +
Date.now();


window[name] =
callback;


const script =
document.createElement(
'script'
);


script.src =
API_URL +
'?action=' +
action +
params +
'&callback=' +
name;


script.onerror =
function() {

document.getElementById(
'status'
).innerText =
'❌ Server tidak terhubung.';

};


document.body.appendChild(
script
);

}


function startTracking() {

if (
!navigator.geolocation
) {

alert(
'Browser tidak mendukung GPS.'
);

return;

}


tracking =
true;


document.getElementById(
'start'
).style.display =
'none';


document.getElementById(
'stop'
).style.display =
'block';


document.getElementById(
'status'
).innerText =
'🟡 Mengaktifkan GPS...';


watchId =
navigator.geolocation
.watchPosition(

function(position) {

sendGPS(
position
);

},

function(error) {

document.getElementById(
'status'
).innerText =
'❌ ' +
error.message;

},

{

enableHighAccuracy:
true,

maximumAge:
2000,

timeout:
10000

}

);

}


function sendGPS(
position
) {

if (
!tracking
) return;


const lat =
position.coords.latitude;


const lng =
position.coords.longitude;


document.getElementById(
'coordinates'
).innerHTML =

'Latitude: ' +
lat.toFixed(6) +

'<br>Longitude: ' +
lng.toFixed(6);


document.getElementById(
'status'
).innerText =
'🟢 Mengirim lokasi...';


const params =

'&driver_id=' +
encodeURIComponent(
driver.driver_id
) +

'&bus_id=' +
encodeURIComponent(
bus.bus_id
) +

'&lat=' +
encodeURIComponent(
lat
) +

'&lng=' +
encodeURIComponent(
lng
) +

'&status=BERJALAN';


api(
'updateLocation',
params,
function(data) {

if (
data.success
) {

document.getElementById(
'status'
).innerText =
'🟢 Bus sedang berjalan';

} else {

document.getElementById(
'status'
).innerText =
'❌ ' +
data.message;

}

});

}


function stopTracking() {

tracking =
false;


if (
watchId !== null
) {

navigator.geolocation
.clearWatch(
watchId
);

watchId =
null;

}


document.getElementById(
'start'
).style.display =
'block';


document.getElementById(
'stop'
).style.display =
'none';


document.getElementById(
'status'
).innerText =
'⚫ Perjalanan dihentikan';

}


function logout() {

stopTracking();


localStorage.removeItem(
'driverSession'
);


window.location =
'login.html';

}

</script>

</body>

</html>
