<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>BusTrack - Login</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="logo">
        🚌
    </div>

    <h1>BusTrack</h1>

    <p class="subtitle">
        Sistem monitoring bus realtime
    </p>

    <div class="card">

        <h2>Masuk</h2>

        <input
            id="username"
            placeholder="Username"
            autocomplete="username">

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password">

        <button onclick="login()">
            MASUK
        </button>

        <p id="message"></p>

        <div class="register-link">
            Belum punya akun?
            <a href="register.html">
                Daftar sebagai driver
            </a>
        </div>

    </div>

</div>

<script>

const API =
    'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';

async function login() {

    const username =
        document.getElementById('username')
            .value.trim();

    const password =
        document.getElementById('password')
            .value;

    const message =
        document.getElementById('message');

    if (!username || !password) {

        message.textContent =
            'Username dan password wajib diisi.';

        return;
    }

    message.textContent =
        'Memproses...';

    try {

        const url =
            API +
            '?action=login' +
            '&username=' +
            encodeURIComponent(username) +
            '&password=' +
            encodeURIComponent(password);

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!data.ok) {

            message.textContent =
                data.error;

            return;
        }

        localStorage.setItem(
            'bus_token',
            data.token
        );

        localStorage.setItem(
            'bus_driver',
            JSON.stringify(data.driver)
        );

        location.href =
            'driver.html';

    } catch (error) {

        message.textContent =
            'Gagal terhubung ke server.';
    }
}

</script>

</body>
</html>
