<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Daftar Driver</title>

<link
rel="stylesheet"
href="style.css">

</head>


<body class="auth-page">


<div class="auth-box">


<div class="auth-icon">
👨‍✈️
</div>


<h1>
Daftar Akun Driver
</h1>


<p>
Buat akun untuk mengoperasikan bus.
</p>


<label>
Nama Driver
</label>

<input
id="nama"
placeholder="Contoh: I Made Arya"
>


<label>
Username
</label>

<input
id="username"
placeholder="Contoh: arya"
>


<label>
Password
</label>


<div class="password-box">

<input
id="password"
type="password"
placeholder="Minimal 6 karakter"
>


<button
type="button"
onclick="togglePassword()">

👁️

</button>

</div>


<label>
Foto Driver
</label>

<input
id="foto"
placeholder="URL foto driver"
>


<label>
Pilih Bus
</label>


<select
id="bus">

<option>
Memuat bus...
</option>

</select>


<button
class="btn full"
onclick="register()">

Daftar Akun

</button>


<div
id="result"
class="result">
</div>


<p class="switch">

Sudah punya akun?

<a href="login.html">
Login
</a>

</p>


</div>


<script>


const API_URL =
'https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec';


function api(
action,
params,
callback
) {

const name =
'cb_' +
Date.now();


window[name] =
callback;


const script =
document.createElement(
'script'
);


script.src =
API_URL +
'?action=' +
action +
params +
'&callback=' +
name;


script.onerror =
function() {

document.getElementById(
'result'
).innerText =
'Server tidak dapat dihubungi.';

};


document.body.appendChild(
script
);

}


function loadBuses() {

api(
'getBuses',
'',
function(data) {

const select =
document.getElementById(
'bus'
);


select.innerHTML =
'<option value="">Pilih bus</option>';


if (
!data.success
) {

select.innerHTML =
'<option>Gagal mengambil bus</option>';

return;

}


data.buses.forEach(
function(bus) {

const option =
document.createElement(
'option'
);


option.value =
bus.bus_id;


option.textContent =
bus.no_bus +
' - ' +
bus.plat;


select.appendChild(
option
);

});

});

}


function togglePassword() {

const input =
document.getElementById(
'password'
);


input.type =
input.type ===
'password'
?
'text'
:
'password';

}


function register() {

const nama =
document.getElementById(
'nama'
).value.trim();


const username =
document.getElementById(
'username'
).value.trim();


const password =
document.getElementById(
'password'
).value;


const foto =
document.getElementById(
'foto'
).value.trim();


const busId =
document.getElementById(
'bus'
).value;


const result =
document.getElementById(
'result'
);


if (
!nama ||
!username ||
!password ||
!busId
) {

result.innerText =
'Lengkapi semua data wajib.';

return;

}


result.innerText =
'Mendaftarkan akun...';


const params =

'&nama=' +
encodeURIComponent(
nama
) +

'&username=' +
encodeURIComponent(
username
) +

'&password=' +
encodeURIComponent(
password
) +

'&foto=' +
encodeURIComponent(
foto
) +

'&bus_id=' +
encodeURIComponent(
busId
);


api(
'register',
params,
function(data) {

if (
data.success
) {

result.innerHTML =

'✅ Akun berhasil dibuat.<br>' +

'ID Driver: ' +
data.driver_id +
'<br>' +

'Bus: ' +
data.bus.bus_id;


setTimeout(
function() {

window.location =
'login.html';

},
2000
);


} else {

result.innerText =
'❌ ' +
data.message;

}

});

}


loadBuses();

</script>

</body>

</html>
