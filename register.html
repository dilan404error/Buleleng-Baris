<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register Driver</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="driver-page">


<div class="driver-container">


    <div class="driver-box">


        <div class="driver-header">

            <div class="driver-icon">
                👨‍✈️
            </div>

            <div>

                <div class="small-title">
                    DRIVER
                </div>

                <h1>
                    Registrasi Driver
                </h1>

            </div>

        </div>


        <label>
            ID Driver
        </label>

        <input
            id="driverId"
            placeholder="Contoh: DR001"
        >


        <label>
            Nama Driver
        </label>

        <input
            id="nama"
            placeholder="Nama lengkap"
        >


        <label>
            URL Foto Driver
        </label>

        <input
            id="foto"
            placeholder="https://..."
        >


        <label>
            Bus
        </label>

        <select
            id="busSelect">

            <option>
                Memuat bus...
            </option>

        </select>


        <div
            id="preview"
            class="photo-preview">

            Foto driver akan muncul di sini

        </div>


        <button
            class="btn-primary full"
            onclick="registerDriver()">

            ✓ Daftarkan Driver

        </button>


        <div
            id="result"
            class="result">

        </div>


    </div>

</div>


<script>


const API_URL =
    "https://script.google.com/macros/s/AKfycbxnFmL5CFPRinOb5mn1obnvRnoW__hLhxRZHy9vB-xBHc339VWZnP6rAIqc6nRt-wr1/exec";


let buses = [];


/* =========================================
   JSONP
========================================= */

function requestJSONP(
    action,
    callbackFunction,
    params = ''
) {

    const callbackName =
        'register_' +
        Date.now();


    window[callbackName] =
        function(data) {

            callbackFunction(data);


            delete window[
                callbackName
            ];


            const old =
                document.getElementById(
                    callbackName
                );

            if (old) {
                old.remove();
            }

        };


    const script =
        document.createElement(
            'script'
        );


    script.id =
        callbackName;


    script.src =
        API_URL +
        '?action=' +
        action +
        params +
        '&callback=' +
        callbackName;


    script.onerror =
        function() {

            document.getElementById(
                'result'
            ).innerHTML =
                '🔴 Gagal terhubung ke server';

            script.remove();

        };


    document.body.appendChild(
        script
    );

}


/* =========================================
   LOAD BUS
========================================= */

function loadBuses() {

    requestJSONP(
        'bus',
        function(data) {

            if (
                data.status ===
                'error'
            ) {

                alert(
                    data.message
                );

                return;

            }


            buses =
                data || [];


            const select =
                document.getElementById(
                    'busSelect'
                );


            select.innerHTML =
                '<option value="">Pilih bus</option>';


            buses.forEach(
                function(bus) {

                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        bus.bus_id;


                    option.textContent =
                        bus.no_bus +
                        ' - ' +
                        bus.plat;


                    select.appendChild(
                        option
                    );

                }
            );

        }
    );

}


/* =========================================
   FOTO PREVIEW
========================================= */

document.getElementById(
    'foto'
).addEventListener(
    'input',
    function() {

        const url =
            this.value.trim();


        const preview =
            document.getElementById(
                'preview'
            );


        if (!url) {

            preview.innerHTML =
                'Foto driver akan muncul di sini';

            return;

        }


        preview.innerHTML = `

            <img
                src="${url}"
                class="preview-photo"
                onerror="
                    this.style.display='none';
                "
            >

        `;

    }
);


/* =========================================
   REGISTER
========================================= */

function registerDriver() {

    const driverId =
        document.getElementById(
            'driverId'
        ).value.trim();


    const nama =
        document.getElementById(
            'nama'
        ).value.trim();


    const foto =
        document.getElementById(
            'foto'
        ).value.trim();


    const busId =
        document.getElementById(
            'busSelect'
        ).value;


    const result =
        document.getElementById(
            'result'
        );


    if (
        !driverId ||
        !nama ||
        !busId
    ) {

        result.innerHTML =
            '⚠️ Lengkapi data driver.';

        return;

    }


    result.innerHTML =
        '🟡 Menyimpan data...';


    const params =

        '&driver_id=' +
        encodeURIComponent(
            driverId
        ) +

        '&nama=' +
        encodeURIComponent(
            nama
        ) +

        '&foto=' +
        encodeURIComponent(
            foto
        ) +

        '&bus_id=' +
        encodeURIComponent(
            busId
        );


    requestJSONP(
        'register',
        function(data) {

            if (
                data.status ===
                'ok'
            ) {

                result.innerHTML =
                    '🟢 Driver berhasil didaftarkan!';

            }

            else {

                result.innerHTML =
                    '🔴 ' +
                    data.message;

            }

        },
        params
    );

}


/* =========================================
   START
========================================= */

loadBuses();

</script>

</body>

</html>
